name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 1.1.0)"
        required: true
        default: "1.1.0"
  push:
    tags:
      - "v*"

env:
  RANDOMX_REF: 10494476d6236b177733224123747201dec180bb

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install -U pip pyinstaller

      - name: Build executables
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          test -f librandomx.dll
          # GUI (primary)
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name bitfuc-miner \
            --add-binary "librandomx.dll;." \
            --hidden-import mine_fuc \
            mine_gui.py
          # CLI
          pyinstaller --noconfirm --clean --onefile --console \
            --name mine_fuc \
            --add-binary "librandomx.dll;." \
            mine_fuc.py
          ls -lh dist/bitfuc-miner.exe dist/mine_fuc.exe

      - name: Package Windows zip
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.event.inputs.version || github.ref_name }}"
          VER="${VER#v}"
          OUT="bitfuc-miner-${VER}-windows-x64"
          mkdir -p "dist/${OUT}"
          cp -f src/dist/bitfuc-miner.exe src/dist/mine_fuc.exe src/librandomx.dll "dist/${OUT}/"
          cp -f README.md LICENSE src/LICENSE.RandomX "dist/${OUT}/"
          cp -f src/mine.bat "dist/${OUT}/mine.bat"
          powershell -Command "Compress-Archive -Path 'dist/${OUT}' -DestinationPath 'dist/${OUT}.zip' -Force"
          ls -lh "dist/${OUT}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/bitfuc-miner-*-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RandomX sources
        run: |
          git clone https://github.com/tevador/RandomX.git vendor/RandomX
          git -C vendor/RandomX checkout "${RANDOMX_REF}"
          cp -f vendor/RandomX/LICENSE src/LICENSE.RandomX

      - name: Build Linux package (Ubuntu 20.04 glibc)
        run: |
          VER="${{ github.event.inputs.version || github.ref_name }}"
          VER="${VER#v}"
          bash scripts/build-linux-compat.sh "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: releases/bitfuc-miner-*-linux-x64.tar.gz
